name: Build iOS Dynamic Island (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ios-island/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    name: Build iOS App & Dynamic Island Widget
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-island
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Widget/Info.plist
          xcodegen generate
          # XcodeGen 2.46 defaults to PBX project format 77, which Xcode 15.4 cannot open.
          # Force the generated project metadata to Xcode 15-compatible format.
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' AgyIsland.xcodeproj/project.pbxproj
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 15.0";/' AgyIsland.xcodeproj/project.pbxproj
          grep -E 'objectVersion|compatibilityVersion' AgyIsland.xcodeproj/project.pbxproj
          ls -la AgyIsland.xcodeproj

      - name: Compile App & Widget with xcodebuild
        run: |
          xcodebuild archive \
            -project ios-island/AgyIsland.xcodeproj \
            -scheme AgyIsland \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AgyIsland.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Verify Compiled Mach-O Executable
        run: |
          APP_PATH="build/AgyIsland.xcarchive/Products/Applications/AgyIsland.app"
          echo "Vérification du contenu du bundle :"
          ls -la "$APP_PATH"
          
          if [ ! -f "$APP_PATH/AgyIsland" ]; then
            echo "❌ Erreur critique : L'exécutable AgyIsland n'a pas été produit par xcodebuild !"
            exit 1
          fi
          
          echo "✅ Exécutable trouvé avec succès :"
          file "$APP_PATH/AgyIsland"

      - name: Package .IPA for Sideloadly
        run: |
          mkdir -p build-output/Payload
          cp -R "build/AgyIsland.xcarchive/Products/Applications/AgyIsland.app" build-output/Payload/
          
          cd build-output
          zip -r -y agy-island.ipa Payload
          echo "✅ Fichier agy-island.ipa prêt pour Sideloadly :"
          ls -lh agy-island.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-island-ios-ipa-build-${{ github.run_number }}
          path: build-output/agy-island.ipa
          retention-days: 14
