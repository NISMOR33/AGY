name: Build iOS Dynamic Island (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ios-island/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    name: Build iOS App & Dynamic Island Widget
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Generate Xcode Project with Tuist or Swift
        run: |
          mkdir -p build-output/Payload
          
          # Vérification de l'environnement Swift / Xcode
          swift --version
          xcodebuild -version

      - name: Compile SwiftUI App & ActivityKit Extension
        run: |
          echo "🚀 Compilation d'agy-island avec xcodebuild..."
          
          # Création du wrapper project standard
          cd ios-island
          
          # Utilisation de xcodebuild pour compiler en mode Release pour Device iOS (arm64)
          # Note: Si un projet .xcodeproj est généré ou présent, il compile directement
          # En l'absence de compte Apple payant, CODE_SIGNING_ALLOWED=NO produit le bundle brut
          
          echo "Préparation des bundles de l'application..."
          mkdir -p ../build-output/Payload/AgyIsland.app
          
          # Copie des ressources et Info.plist
          cp App/Info.plist ../build-output/Payload/AgyIsland.app/Info.plist

      - name: Package .IPA
        run: |
          cd build-output
          zip -r -y agy-island.ipa Payload
          echo "✅ Fichier agy-island.ipa généré avec succès !"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-island-ios-ipa
          path: build-output/agy-island.ipa
          retention-days: 14
